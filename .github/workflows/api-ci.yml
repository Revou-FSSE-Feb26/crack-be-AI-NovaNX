name: NexRead API CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  quality:
    name: Code quality and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: nexread-api
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres@localhost:5432/nexread_test
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: nexread-api/package-lock.json

      - name: Prepare isolated test secrets
        shell: bash
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "JWT_REFRESH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint:check

      - name: Type check
        run: npm run typecheck

      - name: Unit tests with coverage floor
        run: npm test -- --runInBand --coverage

      - name: Build
        run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-coverage-${{ github.run_id }}
          path: nexread-api/coverage/
          if-no-files-found: ignore
          retention-days: 14

  integration:
    name: Database, E2E, and API regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: nexread-api
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres@localhost:5432/nexread_test
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      ADMIN_SEED_EMAIL: ci-admin@example.invalid
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: nexread_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexread_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: nexread-api/package-lock.json

      - name: Prepare isolated test secrets
        shell: bash
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "JWT_REFRESH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ADMIN_SEED_PASSWORD=$(openssl rand -base64 36 | tr -d '\n')" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Apply database migrations
        run: npm run prisma:migrate:deploy

      - name: Seed isolated CI database
        run: npm run prisma:seed

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Build production artifact
        run: npm run build

      - name: Start API for Newman
        shell: bash
        run: |
          npm run start:prod > /tmp/nexread-api.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/health/ready > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nexread-api.log
          exit 1

      - name: Newman API regression
        run: npm run test:newman

      - name: Upload Newman reports and API log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-regression-${{ github.run_id }}
          path: |
            nexread-api/test-report/newman-reports/
            /tmp/nexread-api.log
          if-no-files-found: ignore
          retention-days: 14

  security:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: nexread-api

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: nexread-api/package-lock.json

      - name: Install lockfile without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit

      - name: Reject high or critical production vulnerabilities
        run: npm audit --omit=dev --audit-level=high

  ci-gate:
    name: CI Gate
    if: always()
    needs: [quality, integration, security]
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality gate
        shell: bash
        run: |
          if [[ "${{ needs.quality.result }}" != "success" || \
                "${{ needs.integration.result }}" != "success" || \
                "${{ needs.security.result }}" != "success" ]]; then
            echo "One or more required CI jobs did not pass."
            exit 1
          fi
