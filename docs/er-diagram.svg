<svg width="1100" height="700" viewBox="0 0 1100 700" xmlns="http://www.w3.org/2000/svg" font-family="Menlo,Consolas,monospace">
<rect width="1100" height="700" fill="#0f172a"/><text x="550" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">NexRead — Entity Relationship Diagram</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#94a3b8"/></marker></defs>
<g transform="translate(30 75)"><rect width="280" height="210" rx="7" fill="#111827" stroke="#3b82f6" stroke-width="2"/><rect width="280" height="34" rx="7" fill="#2563eb"/><text x="12" y="23" fill="white" font-weight="bold">User</text><text x="12" y="58" fill="#fbbf24">id: Int [PK, auto]</text><text x="12" y="80" fill="#e2e8f0">fullName: String</text><text x="12" y="102" fill="#e2e8f0">email: String [UNIQUE]</text><text x="12" y="124" fill="#e2e8f0">password: String (bcrypt hash)</text><text x="12" y="146" fill="#e2e8f0">role: USER | ADMIN</text><text x="12" y="168" fill="#e2e8f0">refreshTokenHash: String?</text><text x="12" y="190" fill="#94a3b8">createdAt / updatedAt</text></g>
<g transform="translate(410 75)"><rect width="280" height="210" rx="7" fill="#111827" stroke="#8b5cf6" stroke-width="2"/><rect width="280" height="34" rx="7" fill="#7c3aed"/><text x="12" y="23" fill="white" font-weight="bold">Loan</text><text x="12" y="58" fill="#fbbf24">id: Int [PK, auto]</text><text x="12" y="80" fill="#93c5fd">userId: Int [FK → User.id]</text><text x="12" y="102" fill="#fdba74">bookId: String [FK → Book.id]</text><text x="12" y="124" fill="#e2e8f0">status: ACTIVE | RETURNED</text><text x="12" y="146" fill="#e2e8f0">borrowedAt / dueAt</text><text x="12" y="168" fill="#e2e8f0">returnedAt: DateTime?</text><text x="12" y="190" fill="#fbbf24" font-size="10">CHECK valid lifecycle dates</text></g>
<g transform="translate(790 75)"><rect width="280" height="210" rx="7" fill="#111827" stroke="#f97316" stroke-width="2"/><rect width="280" height="34" rx="7" fill="#ea580c"/><text x="12" y="23" fill="white" font-weight="bold">Book</text><text x="12" y="58" fill="#fbbf24">id: String [PK]</text><text x="12" y="80" fill="#e2e8f0">title / rating [CHECK 0..5]</text><text x="12" y="102" fill="#e2e8f0">totalCopies / availableCopies [CHECK]</text><text x="12" y="124" fill="#e2e8f0">isAvailable / deletedAt?</text><text x="12" y="146" fill="#93c5fd">authorId: String [FK]</text><text x="12" y="168" fill="#86efac">categoryId: String [FK]</text><text x="12" y="190" fill="#94a3b8">coverClassName? / timestamps</text></g>
<g transform="translate(30 410)"><rect width="430" height="210" rx="7" fill="#111827" stroke="#ec4899" stroke-width="2"/><rect width="430" height="34" rx="7" fill="#db2777"/><text x="12" y="23" fill="white" font-weight="bold">Review</text><text x="12" y="58" fill="#fbbf24">id: Int [PK, auto]</text><text x="12" y="80" fill="#93c5fd">userId: Int [FK → User.id]</text><text x="12" y="102" fill="#fdba74">bookId: String [FK → Book.id]</text><text x="12" y="124" fill="#e2e8f0">rating: Int [CHECK 1..5]</text><text x="12" y="146" fill="#e2e8f0">comment: String?</text><text x="12" y="168" fill="#fbbf24">UNIQUE (userId, bookId)</text><text x="12" y="190" fill="#94a3b8">createdAt / updatedAt</text></g>
<g transform="translate(545 430)"><rect width="300" height="190" rx="7" fill="#111827" stroke="#3b82f6" stroke-width="2"/><rect width="300" height="34" rx="7" fill="#2563eb"/><text x="12" y="23" fill="white" font-weight="bold">Author</text><text x="12" y="58" fill="#fbbf24">id: String [PK]</text><text x="12" y="80" fill="#e2e8f0">name: String [UNIQUE]</text><text x="12" y="102" fill="#e2e8f0">booksCount: Int [CHECK ≥ 0]</text><text x="12" y="124" fill="#e2e8f0">borrowedBooksCount: Int [CHECK ≥ 0]</text><text x="12" y="146" fill="#e2e8f0">rating: Float [CHECK 0..5]</text><text x="12" y="168" fill="#94a3b8">avatarPath? / timestamps</text></g>
<g transform="translate(875 430)"><rect width="195" height="190" rx="7" fill="#111827" stroke="#22c55e" stroke-width="2"/><rect width="195" height="34" rx="7" fill="#16a34a"/><text x="12" y="23" fill="white" font-weight="bold">Category</text><text x="12" y="58" fill="#fbbf24">id: String [PK]</text><text x="12" y="80" fill="#e2e8f0">name [UNIQUE]</text><text x="12" y="102" fill="#e2e8f0">slug [UNIQUE]</text><text x="12" y="124" fill="#e2e8f0">subtitle?</text><text x="12" y="146" fill="#e2e8f0">iconPath?</text><text x="12" y="168" fill="#94a3b8">timestamps</text></g>
<path d="M310 180H410" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><text x="325" y="170" fill="#cbd5e1">1</text><text x="390" y="170" fill="#cbd5e1">N</text><path d="M690 180H790" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><text x="705" y="170" fill="#cbd5e1">N</text><text x="770" y="170" fill="#cbd5e1">1</text>
<path d="M830 430V285" stroke="#60a5fa" stroke-width="2" marker-end="url(#a)"/><text x="840" y="415" fill="#93c5fd">1</text><text x="840" y="305" fill="#93c5fd">N</text><path d="M970 430V285" stroke="#86efac" stroke-width="2" marker-end="url(#a)"/><text x="980" y="415" fill="#86efac">1</text><text x="980" y="305" fill="#86efac">N</text>
<path d="M170 285V410" stroke="#ec4899" stroke-width="2" marker-end="url(#a)"/><path d="M790 245L460 490" stroke="#ec4899" stroke-width="2" marker-end="url(#a)"/>
<text x="30" y="670" fill="#cbd5e1">User/Book 1—N Loan · User/Book 1—N Review · Author/Category 1—N Book</text>
</svg>
