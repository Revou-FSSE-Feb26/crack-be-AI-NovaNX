<svg width="980" height="610" viewBox="0 0 980 610" xmlns="http://www.w3.org/2000/svg" font-family="Menlo, Consolas, 'Courier New', monospace">
  <rect x="0" y="0" width="980" height="610" fill="#0f172a" />

  <text x="490" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#f8fafc">
    NexRead - Entity Relationship Diagram
  </text>
  <text x="490" y="46" text-anchor="middle" font-size="11" fill="#94a3b8">
    Prisma models: field connections between Author, Category, Book and User
  </text>

  <!-- ================= AUTHOR ================= -->
  <g>
    <rect x="40" y="50" width="250" height="190" rx="6" fill="#0b1220" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="40" y="50" width="250" height="30" rx="6" fill="#2563eb"/>
    <rect x="40" y="70" width="250" height="10" fill="#2563eb"/>
    <text x="50" y="70" font-size="13" font-weight="bold" fill="#ffffff">Author</text>

    <line x1="40" y1="100" x2="290" y2="100" stroke="#1e293b"/>
    <line x1="40" y1="120" x2="290" y2="120" stroke="#1e293b"/>
    <line x1="40" y1="140" x2="290" y2="140" stroke="#1e293b"/>
    <line x1="40" y1="160" x2="290" y2="160" stroke="#1e293b"/>
    <line x1="40" y1="180" x2="290" y2="180" stroke="#1e293b"/>
    <line x1="40" y1="200" x2="290" y2="200" stroke="#1e293b"/>
    <line x1="40" y1="220" x2="290" y2="220" stroke="#1e293b"/>

    <text x="50" y="94"  font-size="11" fill="#fbbf24">id: String  [PK]</text>
    <text x="50" y="114" font-size="11" fill="#e2e8f0">name: String (unique)</text>
    <text x="50" y="134" font-size="11" fill="#e2e8f0">booksCount: Int</text>
    <text x="50" y="154" font-size="11" fill="#e2e8f0">borrowedBooksCount: Int</text>
    <text x="50" y="174" font-size="11" fill="#e2e8f0">rating: Float</text>
    <text x="50" y="194" font-size="11" fill="#e2e8f0">avatarPath: String?</text>
    <text x="50" y="214" font-size="11" fill="#94a3b8">createdAt: DateTime</text>
    <text x="50" y="234" font-size="11" fill="#94a3b8">updatedAt: DateTime</text>
  </g>

  <!-- ================= CATEGORY ================= -->
  <g>
    <rect x="670" y="50" width="270" height="170" rx="6" fill="#0b1220" stroke="#22c55e" stroke-width="1.5"/>
    <rect x="670" y="50" width="270" height="30" rx="6" fill="#16a34a"/>
    <rect x="670" y="70" width="270" height="10" fill="#16a34a"/>
    <text x="680" y="70" font-size="13" font-weight="bold" fill="#ffffff">Category</text>

    <line x1="670" y1="100" x2="940" y2="100" stroke="#1e293b"/>
    <line x1="670" y1="120" x2="940" y2="120" stroke="#1e293b"/>
    <line x1="670" y1="140" x2="940" y2="140" stroke="#1e293b"/>
    <line x1="670" y1="160" x2="940" y2="160" stroke="#1e293b"/>
    <line x1="670" y1="180" x2="940" y2="180" stroke="#1e293b"/>
    <line x1="670" y1="200" x2="940" y2="200" stroke="#1e293b"/>

    <text x="680" y="94"  font-size="11" fill="#fbbf24">id: String  [PK]</text>
    <text x="680" y="114" font-size="11" fill="#e2e8f0">name: String (unique)</text>
    <text x="680" y="134" font-size="11" fill="#e2e8f0">slug: String (unique)</text>
    <text x="680" y="154" font-size="11" fill="#e2e8f0">subtitle: String?</text>
    <text x="680" y="174" font-size="11" fill="#e2e8f0">iconPath: String?</text>
    <text x="680" y="194" font-size="11" fill="#94a3b8">createdAt: DateTime</text>
    <text x="680" y="214" font-size="11" fill="#94a3b8">updatedAt: DateTime</text>
  </g>

  <!-- ================= BOOK ================= -->
  <g>
    <rect x="355" y="360" width="270" height="190" rx="6" fill="#0b1220" stroke="#f97316" stroke-width="1.5"/>
    <rect x="355" y="360" width="270" height="30" rx="6" fill="#ea580c"/>
    <rect x="355" y="380" width="270" height="10" fill="#ea580c"/>
    <text x="365" y="380" font-size="13" font-weight="bold" fill="#ffffff">Book</text>

    <line x1="355" y1="410" x2="625" y2="410" stroke="#1e293b"/>
    <line x1="355" y1="430" x2="625" y2="430" stroke="#1e293b"/>
    <line x1="355" y1="450" x2="625" y2="450" stroke="#1e293b"/>
    <line x1="355" y1="470" x2="625" y2="470" stroke="#1e293b"/>
    <line x1="355" y1="490" x2="625" y2="490" stroke="#1e293b"/>
    <line x1="355" y1="510" x2="625" y2="510" stroke="#1e293b"/>
    <line x1="355" y1="530" x2="625" y2="530" stroke="#1e293b"/>

    <text x="365" y="404" font-size="11" fill="#fbbf24">id: String  [PK]</text>
    <text x="365" y="424" font-size="11" fill="#e2e8f0">title: String</text>
    <text x="365" y="444" font-size="11" fill="#e2e8f0">rating: Float</text>
    <text x="365" y="464" font-size="11" fill="#e2e8f0">coverClassName: String?</text>
    <text x="365" y="484" font-size="11" fill="#93c5fd">authorId: String  [FK -&gt; Author.id]</text>
    <text x="365" y="504" font-size="11" fill="#86efac">categoryId: String  [FK -&gt; Category.id]</text>
    <text x="365" y="524" font-size="11" fill="#94a3b8">createdAt: DateTime</text>
    <text x="365" y="544" font-size="11" fill="#94a3b8">updatedAt: DateTime</text>
  </g>

  <!-- ================= USER (standalone) ================= -->
  <g>
    <rect x="40" y="360" width="250" height="150" rx="6" fill="#0b1220" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="40" y="360" width="250" height="30" rx="6" fill="#475569"/>
    <rect x="40" y="380" width="250" height="10" fill="#475569"/>
    <text x="50" y="380" font-size="13" font-weight="bold" fill="#ffffff">User</text>

    <line x1="40" y1="410" x2="290" y2="410" stroke="#1e293b"/>
    <line x1="40" y1="430" x2="290" y2="430" stroke="#1e293b"/>
    <line x1="40" y1="450" x2="290" y2="450" stroke="#1e293b"/>
    <line x1="40" y1="470" x2="290" y2="470" stroke="#1e293b"/>
    <line x1="40" y1="490" x2="290" y2="490" stroke="#1e293b"/>

    <text x="50" y="404" font-size="11" fill="#fbbf24">id: Int  [PK, autoincrement]</text>
    <text x="50" y="424" font-size="11" fill="#e2e8f0">fullName: String</text>
    <text x="50" y="444" font-size="11" fill="#e2e8f0">email: String (unique)</text>
    <text x="50" y="464" font-size="11" fill="#e2e8f0">password: String</text>
    <text x="50" y="484" font-size="11" fill="#94a3b8">createdAt: DateTime</text>
    <text x="50" y="504" font-size="11" fill="#94a3b8">updatedAt: DateTime</text>

    <text x="165" y="530" text-anchor="middle" font-size="10" font-style="italic" fill="#64748b">
      no relations yet (auth pending)
    </text>
  </g>

  <!-- ================= RELATIONS ================= -->
  <!-- Author (1) -> Book (N) via authorId -->
  <path d="M165,240 L165,290 L415,290 L415,360" fill="none" stroke="#93c5fd" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="150" y="285" font-size="11" fill="#93c5fd">1</text>
  <text x="400" y="352" font-size="11" fill="#93c5fd">N</text>

  <!-- Category (1) -> Book (N) via categoryId -->
  <path d="M805,220 L805,320 L565,320 L565,360" fill="none" stroke="#86efac" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="790" y="235" font-size="11" fill="#86efac">1</text>
  <text x="550" y="352" font-size="11" fill="#86efac">N</text>

  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#93c5fd"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#86efac"/>
    </marker>
  </defs>

  <!-- Legend -->
  <g>
    <text x="40" y="580" font-size="11" fill="#fbbf24">[PK]</text>
    <text x="75" y="580" font-size="11" fill="#cbd5e1">Primary key</text>
    <text x="180" y="580" font-size="11" fill="#93c5fd">[FK]</text>
    <text x="215" y="580" font-size="11" fill="#cbd5e1">Foreign key</text>
    <text x="320" y="580" font-size="11" fill="#cbd5e1">1 —— N : one-to-many relation</text>
  </g>
</svg>
