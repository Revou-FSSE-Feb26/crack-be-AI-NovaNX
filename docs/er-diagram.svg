<svg width="1500" height="920" viewBox="0 0 1500 920" xmlns="http://www.w3.org/2000/svg" font-family="Inter,Arial,sans-serif">
  <rect width="1500" height="920" fill="#0f172a"/>
  <text x="750" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#f8fafc">NexRead — Entity Relationship Diagram</text>
  <text x="750" y="62" text-anchor="middle" font-size="13" fill="#94a3b8">PostgreSQL · Prisma ORM · 10 relational models</text>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#64748b"/></marker>
    <style>.rel{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}.card{fill:#111827;stroke:#475569;stroke-width:2}.head{fill:#2563eb}.title{fill:#fff;font-size:16px;font-weight:700}.field{fill:#cbd5e1;font-size:12px}.key{fill:#fbbf24;font-size:12px}.fk{fill:#93c5fd;font-size:12px}.note{fill:#94a3b8;font-size:11px}</style>
  </defs>
  <path class="rel" d="M270 185H330"/><path class="rel" d="M570 185H630"/><path class="rel" d="M870 185H930"/><path class="rel" d="M1170 185H1230"/>
  <path class="rel" d="M450 580V350"/><path class="rel" d="M750 580V350"/><path class="rel" d="M1050 580V350"/><path class="rel" d="M1350 580V350"/>
  <path class="rel" d="M570 705H630"/><path class="rel" d="M270 705H330"/><path class="rel" d="M570 760C900 880 1200 880 1230 760"/>

  <g transform="translate(30 90)"><rect class="card" width="240" height="260" rx="8"/><rect class="head" width="240" height="38" rx="8"/><text class="title" x="14" y="25">Author</text><text class="key" x="14" y="62">id: String [PK]</text><text class="field" x="14" y="84">name: String [UNIQUE]</text><text class="field" x="14" y="106">booksCount / borrowedBooksCount</text><text class="field" x="14" y="128">rating / avatarPath?</text><text class="field" x="14" y="150">deletedAt? / timestamps</text><text class="note" x="14" y="190">1 — N Book</text></g>
  <g transform="translate(330 90)"><rect class="card" width="240" height="260" rx="8"/><rect class="head" width="240" height="38" rx="8"/><text class="title" x="14" y="25">Book</text><text class="key" x="14" y="62">id: String [PK]</text><text class="field" x="14" y="84">title / rating / coverUrl?</text><text class="fk" x="14" y="106">authorId / categoryId [FK]</text><text class="field" x="14" y="128">totalCopies / availableCopies</text><text class="field" x="14" y="150">isAvailable / deletedAt?</text><text class="note" x="14" y="190">1 — N Copy, Loan, Review, Cart</text></g>
  <g transform="translate(630 90)"><rect class="card" width="240" height="260" rx="8"/><rect class="head" width="240" height="38" rx="8"/><text class="title" x="14" y="25">BookCopy</text><text class="key" x="14" y="62">id: Int [PK, auto]</text><text class="fk" x="14" y="84">bookId: String [FK]</text><text class="field" x="14" y="106">barcode: String [UNIQUE]</text><text class="field" x="14" y="128">status: BookCopyStatus</text><text class="field" x="14" y="150">shelfCode? / timestamps</text><text class="note" x="14" y="190">1 — N Loan, CopyAuditLog</text></g>
  <g transform="translate(930 90)"><rect class="card" width="240" height="260" rx="8"/><rect class="head" width="240" height="38" rx="8"/><text class="title" x="14" y="25">BookCopyAuditLog</text><text class="key" x="14" y="62">id: Int [PK, auto]</text><text class="fk" x="14" y="84">bookCopyId / actorAdminId [FK]</text><text class="field" x="14" y="106">previousStatus / newStatus</text><text class="field" x="14" y="128">note? / createdAt</text><text class="note" x="14" y="168">N — 1 BookCopy</text><text class="note" x="14" y="190">N — 1 User (admin)</text></g>
  <g transform="translate(1230 90)"><rect class="card" width="240" height="260" rx="8"/><rect class="head" width="240" height="38" rx="8"/><text class="title" x="14" y="25">Category</text><text class="key" x="14" y="62">id: String [PK]</text><text class="field" x="14" y="84">name / slug [UNIQUE]</text><text class="field" x="14" y="106">subtitle? / iconPath?</text><text class="field" x="14" y="128">createdAt / updatedAt</text><text class="note" x="14" y="168">1 — N Book</text></g>

  <g transform="translate(30 580)"><rect class="card" width="240" height="260" rx="8"/><rect class="head" width="240" height="38" rx="8"/><text class="title" x="14" y="25">AdminAuditLog</text><text class="key" x="14" y="62">id: Int [PK, auto]</text><text class="fk" x="14" y="84">actorAdminId / targetUserId [FK]</text><text class="field" x="14" y="106">action: AdminAuditAction</text><text class="field" x="14" y="128">previousRole? / newRole?</text><text class="field" x="14" y="150">createdAt</text><text class="note" x="14" y="190">N — 1 User (actor and target)</text></g>
  <g transform="translate(330 580)"><rect class="card" width="240" height="260" rx="8"/><rect class="head" width="240" height="38" rx="8"/><text class="title" x="14" y="25">User</text><text class="key" x="14" y="62">id: Int [PK, auto]</text><text class="field" x="14" y="84">email: String [UNIQUE]</text><text class="field" x="14" y="106">password hash / role</text><text class="field" x="14" y="128">tokenVersion / deletedAt?</text><text class="note" x="14" y="168">1 — N Loan, Review, Cart</text><text class="note" x="14" y="190">1 — N audit actions</text></g>
  <g transform="translate(630 580)"><rect class="card" width="240" height="260" rx="8"/><rect class="head" width="240" height="38" rx="8"/><text class="title" x="14" y="25">Loan</text><text class="key" x="14" y="62">id: Int [PK, auto]</text><text class="fk" x="14" y="84">userId / bookId / bookCopyId? [FK]</text><text class="field" x="14" y="106">ACTIVE | RETURN_REQUESTED</text><text class="field" x="14" y="128">| RETURNED</text><text class="field" x="14" y="150">borrowedAt / dueAt / returnedAt?</text><text class="fk" x="14" y="172">returnedByAdminId? [FK]</text><text class="note" x="14" y="210">N — 1 User, Book, BookCopy</text></g>
  <g transform="translate(930 580)"><rect class="card" width="240" height="260" rx="8"/><rect class="head" width="240" height="38" rx="8"/><text class="title" x="14" y="25">Review</text><text class="key" x="14" y="62">id: Int [PK, auto]</text><text class="fk" x="14" y="84">userId / bookId [FK]</text><text class="field" x="14" y="106">rating: Int [CHECK 1..5]</text><text class="field" x="14" y="128">comment?</text><text class="field" x="14" y="150">UNIQUE (userId, bookId)</text><text class="note" x="14" y="190">N — 1 User and Book</text></g>
  <g transform="translate(1230 580)"><rect class="card" width="240" height="260" rx="8"/><rect class="head" width="240" height="38" rx="8"/><text class="title" x="14" y="25">CartItem</text><text class="key" x="14" y="62">id: Int [PK, auto]</text><text class="fk" x="14" y="84">userId / bookId [FK, CASCADE]</text><text class="field" x="14" y="106">createdAt</text><text class="field" x="14" y="128">UNIQUE (userId, bookId)</text><text class="note" x="14" y="168">N — 1 User and Book</text></g>
  <text x="30" y="890" fill="#94a3b8" font-size="12">PK = primary key · FK = foreign key · arrows indicate one-to-many relationships · soft deletion preserves historical records</text>
</svg>
